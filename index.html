<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Invitation</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 50% 50%, #fff5f7 0%, #fbdde2 25%, #f5bbc5 50%, #e394a1 75%, #d17080 100%);
    font-family: 'Playfair Display', "Georgia", serif;
    padding: 20px;
    overflow-x:hidden;
    position:relative;
  }

  /* Floating background stickers */
  .bg-sticker {
    position: absolute;
    font-size: 30px;
    opacity: 0.6;
    pointer-events: none;
    animation: floatColorful 8s ease-in-out infinite alternate;
  }
  @keyframes floatColorful {
    0% { transform: translateY(0px) rotate(0deg) scale(1); }
    100% { transform: translateY(-30px) rotate(20deg) scale(1.1); }
  }

  /* Rising balloons */
  .balloon {
    position: fixed;
    bottom: -120px;
    font-size: 46px;
    pointer-events: none;
    z-index: 0;
    animation: riseUp linear infinite;
    opacity: 0.85;
  }
  @keyframes riseUp {
    0% { transform: translateY(0) translateX(0) rotate(-6deg); opacity: 0; }
    10% { opacity: 0.85; }
    50% { transform: translateY(-55vh) translateX(20px) rotate(6deg); }
    90% { opacity: 0.85; }
    100% { transform: translateY(-110vh) translateX(-15px) rotate(-6deg); opacity: 0; }
  }

  /* Twinkling stars */
  .twinkle {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    animation: twinkleFade 2.4s ease-in-out infinite;
  }
  @keyframes twinkleFade {
    0%, 100% { opacity: 0.15; transform: scale(0.8); }
    50% { opacity: 0.9; transform: scale(1.15); }
  }

  .stage {
    position:relative;
    width:100%;
    max-width:420px;
    z-index:2;
  }

  /* Envelope / Initial Screen */
  .btn-wrap {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding:40px 20px;
    text-align:center;
    background: rgba(255, 250, 252, 0.7);
    backdrop-filter: blur(15px);
    border-radius: 30px;
    border: 3px solid #ffffff;
    box-shadow: 0 15px 40px rgba(163, 76, 90, 0.3);
  }

  .btn-wrap p {
    color: #a34c5a;
    font-size: 16px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    font-weight: bold;
  }

  @keyframes hop {
    0% { transform: translateY(0) rotate(-4deg); }
    100% { transform: translateY(-10px) rotate(4deg); }
  }

  #openBtn {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #ff99aa, #e06076, #cc445b);
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(163, 76, 90, 0.6);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: pulseColorful 2s infinite;
  }
  #openBtn:hover { transform: scale(1.1); }
  @keyframes pulseColorful {
    0%, 100% { box-shadow: 0 0 0 0 rgba(204, 68, 91, 0.5); }
    50% { box-shadow: 0 0 0 20px rgba(204, 68, 91, 0); }
  }

  /* Main Card Aesthetics */
  .card {
    display:none;
    background: #fffcf8;
    border: 15px solid #ffffff;
    border-radius: 40px;
    padding: 40px 30px 35px;
    text-align:center;
    box-shadow: 0 25px 65px rgba(133, 62, 74, 0.25);
    position:relative;
    overflow:hidden;
  }
  .card.show {
    display:block;
    animation: cardInColorful 0.9s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes cardInColorful {
    from { opacity:0; transform: translateY(50px) scale(0.85); }
    to { opacity:1; transform: translateY(0) scale(1); }
  }

  /* Sparkle shimmer sweep across the card border on entry */
  .card::after {
    content: "";
    position: absolute;
    top: -50%; left: -60%;
    width: 40%; height: 200%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: rotate(15deg);
    animation: shimmerSweep 2.6s ease-in-out 1;
    pointer-events: none;
  }
  @keyframes shimmerSweep {
    0% { left: -60%; }
    100% { left: 130%; }
  }

  /* Floral & Decorative Sticker Overlays */
  .flower-decor {
    position: absolute;
    pointer-events: none;
    z-index: 1;
  }
  .fl-top-left { top: -15px; left: -15px; width: 130px; }
  .fl-bottom-right { bottom: -15px; right: -15px; width: 130px; transform: rotate(180deg); }

  .sticker-ribbon {
    width: 75px;
    margin: 0 auto 15px;
    display: block;
    animation: ribbonWiggle 3s ease-in-out infinite;
  }
  @keyframes ribbonWiggle {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }

  .eyebrow {
    font-family: 'Georgia', serif;
    font-style: italic;
    font-size: 18px;
    color: #bf6e7b;
    margin-bottom: 15px;
  }

  /* Frame Container */
  .frame-container {
    position: relative;
    width: 240px;
    height: 260px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .oval-frame {
    width: 200px;
    height: 240px;
    border-radius: 50%;
    background: #f5bbc5;
    padding: 8px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.15), 0 10px 25px rgba(163, 76, 90, 0.25);
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
  }

  .oval-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #ffffff;
  }

  /* Glow ring pulsing behind the photo */
  .oval-frame::before {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.5), transparent 70%);
    animation: glowPulse 2.8s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(0.95); opacity: 0.5; }
    50% { transform: scale(1.08); opacity: 0.9; }
  }

  /* Sticker elements around photo */
  .sticker-sparkle {
    position: absolute;
    top: 0px;
    right: 5px;
    font-size: 30px;
    animation: spinColorful 8s linear infinite;
  }
  @keyframes spinColorful { 100% { transform: rotate(-360deg); } }

  .sticker-heart {
    position: absolute;
    bottom: 5px;
    left: 5px;
    font-size: 32px;
    animation: pulseHeartColorful 1.8s ease-in-out infinite;
  }
  @keyframes pulseHeartColorful {
    0%, 100% { transform: scale(1) rotate(-10deg); }
    50% { transform: scale(1.3) rotate(10deg); }
  }

  .sticker-cake {
    position: absolute;
    top: 10px;
    left: -10px;
    font-size: 28px;
    animation: bounceCake 1.6s ease-in-out infinite;
  }
  @keyframes bounceCake {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-8px) rotate(8deg); }
  }

  .sticker-balloonTiny {
    position: absolute;
    bottom: -6px;
    right: -8px;
    font-size: 28px;
    animation: swayTiny 2.4s ease-in-out infinite;
  }
  @keyframes swayTiny {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    50% { transform: rotate(8deg) translateY(-6px); }
  }

  h1 {
    color: #331d21;
    font-size: 38px;
    font-weight: 700;
    font-family: 'Playfair Display', 'Georgia', serif;
    margin-bottom: 5px;
    line-height: 1.1;
  }

  .sub-title {
    color: #cc445b;
    font-size: 22px;
    font-family: Arial, sans-serif;
    font-weight: 600;
    letter-spacing: 1.5px;
    margin-bottom: 15px;
  }

  .romantic-line {
    font-family: 'Georgia', serif;
    font-style: italic;
    color: #663a42;
    font-size: 16px;
    line-height: 1.6;
    margin: 15px 0;
    padding: 0 15px;
  }

  .divider {
    width: 100px;
    height: 2px;
    background: #e394a1;
    margin: 20px auto;
    position: relative;
  }
  .divider::before {
    content: "✦";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #fffcf8;
    color: #e06076;
    padding: 0 8px;
    font-size: 14px;
  }

  .next-btn {
    font-family: Arial, sans-serif;
    background: #e06076;
    border: none;
    color: #ffffff;
    padding: 15px 40px;
    border-radius: 30px;
    letter-spacing: 2px;
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 15px;
    box-shadow: 0 7px 20px rgba(224, 96, 118, 0.4);
    transition: all 0.3s ease;
  }
  .next-btn:hover { background: #cc445b; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(204, 68, 91, 0.5); }

  /* Card 2 Info Styles */
  .info-list { margin: 25px 0; }
  .info-row {
    display: flex;
    align-items: center;
    gap: 20px;
    text-align: left;
    font-family: Arial, sans-serif;
    padding: 15px 15px;
    margin-bottom: 12px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 18px;
    transition: transform 0.25s ease;
  }
  .info-row:hover { transform: translateX(4px); }
  .info-row .ic {
    width: 50px;
    height: 50px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #fbdde2;
    color: #cc445b;
    font-size: 22px;
  }
  .info-row .label {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #bf6e7b;
    font-weight: bold;
    margin-bottom: 2px;
  }
  .info-row .value { font-size: 16px; color: #331d21; font-weight: 600; }

  .rsvp-box {
    background: #fbdde2;
    border-radius: 25px;
    padding: 18px;
    margin-top: 20px;
    font-family: Arial, sans-serif;
    color: #a34c5a;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    animation: rsvpGlow 2.4s ease-in-out infinite;
  }
  @keyframes rsvpGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224,96,118,0.25); }
    50% { box-shadow: 0 0 0 10px rgba(224,96,118,0); }
  }

  /* Confetti burst */
  .confetti {
    position:fixed;
    top:-15px;
    opacity:0;
    pointer-events:none;
    z-index: 5;
    border-radius: 2px;
  }
  .confetti.fall { animation: confettiFallColorful 3.6s ease-in forwards; }
  @keyframes confettiFallColorful {
    0% { opacity:1; transform: translateY(-15px) rotate(0deg) scale(1); }
    100% { opacity:0; transform: translateY(650px) rotate(720deg) scale(0.5); }
  }
</style>
</head>

<script>
function launchConfetti() {
  const colors = ['#ff99aa', '#e06076', '#cc445b', '#f5bbc5', '#fff2b0', '#a8b55b', '#ffffff'];
  const shapes = ['🎉','🎊','✨','💖','⭐'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDelay = (Math.random() * 0.6) + 's';

    if (Math.random() > 0.5) {
      // emoji confetti
      el.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      el.style.fontSize = (14 + Math.random() * 14) + 'px';
    } else {
      // square confetti
      el.style.width = (6 + Math.random() * 6) + 'px';
      el.style.height = (10 + Math.random() * 6) + 'px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
    }

    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('fall'));
    setTimeout(() => el.remove(), 4200);
  }
}

function spawnBalloons() {
  const layer = document.getElementById('balloonLayer');
  const balloonEmojis = ['🎈','🎈','🎈'];
  const colorsLeft = ['5%','20%','35%','55%','70%','85%'];
  colorsLeft.forEach((left, i) => {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.textContent = balloonEmojis[i % balloonEmojis.length];
    b.style.left = left;
    b.style.animationDuration = (14 + Math.random() * 8) + 's';
    b.style.animationDelay = (Math.random() * 10) + 's';
    layer.appendChild(b);
  });
}

function spawnTwinkles() {
  const layer = document.getElementById('twinkleLayer');
  for (let i = 0; i < 18; i++) {
    const t = document.createElement('div');
    t.className = 'twinkle';
    t.textContent = '✦';
    t.style.left = Math.random() * 100 + 'vw';
    t.style.top = Math.random() * 100 + 'vh';
    t.style.color = '#ffffff';
    t.style.fontSize = (8 + Math.random() * 10) + 'px';
    t.style.animationDelay = (Math.random() * 2.4) + 's';
    layer.appendChild(t);
  }
}

function reveal() {
  document.getElementById('btnWrap').style.display = 'none';
  document.getElementById('card1').classList.add('show');
  launchConfetti();
}

function nextCard() {
  document.getElementById('card1').classList.remove('show');
  document.getElementById('card1').style.display = 'none';
  document.getElementById('card2').classList.add('show');
  launchConfetti();
}

spawnBalloons();
spawnTwinkles();
</script>
